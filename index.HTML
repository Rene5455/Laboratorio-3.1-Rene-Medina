<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio 3.1 HTML5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Página Básica HTML5</h1>
        <nav>
            <a href="#inicio">Inicio</a> | 
            <a href="#media">Multimedia</a>
        </nav>
    </header>

    <main>
        <section id="inicio">
            <h2>Inicio</h2>
            <p>Página estructurada en HTML5.</p>
        </section>

        <article>
            <h2>Etiquetas Básicas</h2>
            <ul>
                <li>Encabezado</li>
                <li>Párrafo</li>
                <li>Lista</li>
            </ul>
        </article>

        <section id="media">
            <h2>Multimedia HTML5</h2>
            
            <figure>
                <img src="https://via.placeholder.com/150" alt="Ejemplo">
                <figcaption>Imagen con pie de foto</figcaption>
            </figure>

            <p>Audio:</p>
            <audio controls src="audio.mp3"></audio>

            <p>Video:</p>
            <video controls src="video.mp4" width="300"></video>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mi Proyecto</p>

        <!--
        Ventajas de HTML5:
        1. Estructura semántica simple y clara. <header> <main> <footer>
        2. SEO y Accesibilidad: Mejor lectura por buscadores y lectores de pantalla.
        3. El HTML brinda soporte nativo de multimedia sin necesidad de plugins y es muy simple de añadir.
        -->
    </footer>

</body>
</html>
